    background:repeating-linear-gradient(90deg,var(--cream) 0 38px,transparent 38px 90px);
    animation:dash .5s linear infinite}
  @keyframes dash{to{background-position-x:-90px}}

  /* ---------- ÇEKİCİ ---------- */
  .truck{position:absolute;left:50%;bottom:20px;width:min(460px,96%);transform:translateX(-50%);overflow:visible}
  .truck text{font-family:'Poppins',sans-serif}
  .wheel{transform-box:fill-box;transform-origin:center;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .body{animation:bob .42s ease-in-out infinite alternate;transform-box:view-box;transform-origin:130px 140px}
  @keyframes bob{from{transform:translateY(0) rotate(0)}to{transform:translateY(-1.6px) rotate(-.22deg)}}
  .cargo{animation:jig .27s ease-in-out infinite alternate}
  @keyframes jig{from{transform:translateY(0)}to{transform:translateY(-.9px)}}
  .shadow{transform-box:fill-box;transform-origin:center;animation:sh .42s ease-in-out infinite alternate}
  @keyframes sh{from{transform:scaleX(1);opacity:.55}to{transform:scaleX(.985);opacity:.45}}
  .l1{animation:blink .7s steps(1) infinite}
  .l2{animation:blink .7s steps(1) infinite;animation-delay:-.35s}
  @keyframes blink{0%{opacity:1}50%{opacity:.1}}
  .smoke{transform-box:fill-box;transform-origin:center;opacity:0;animation:puff 1.6s ease-out infinite}
  .smoke:nth-of-type(2){animation-delay:.4s}.smoke:nth-of-type(3){animation-delay:.8s}.smoke:nth-of-type(4){animation-delay:1.2s}
  @keyframes puff{0%{opacity:.55;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(-70px,-34px) scale(2.6)}}

  .bar{width:min(320px,80vw);height:6px;border-radius:6px;background:rgba(234,205,162,.2);overflow:hidden}
  .bar i{display:block;height:100%;width:40%;border-radius:6px;background:var(--cream);animation:load 1.6s ease-in-out infinite}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
